<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This Planet Is Forming — NextXus Federation</title>
<meta name="description" content="This NextXus Federation tool is under construction. Check back soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  background:#070b14;
  color:#e0e0e0;
  font-family:'Inter',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}
canvas#starfield{
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:0;pointer-events:none;
}
.content{
  position:relative;z-index:1;
  text-align:center;
  padding:2rem;
}
.planet-icon{
  width:80px;height:80px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(201,168,76,.5),rgba(201,168,76,.12));
  border:1.5px solid rgba(201,168,76,.4);
  box-shadow:0 0 60px rgba(201,168,76,.15),0 0 120px rgba(201,168,76,.06);
  margin:0 auto 2rem;
  animation:forming 3s ease-in-out infinite;
}
@keyframes forming{
  0%,100%{transform:scale(1);opacity:.8;}
  50%{transform:scale(1.08);opacity:1;}
}
h1{
  font-size:clamp(1.2rem,3.5vw,1.8rem);
  font-weight:600;
  color:#fff;
  margin-bottom:.6rem;
  letter-spacing:.04em;
}
p.message{
  font-size:clamp(.9rem,2.5vw,1.1rem);
  font-weight:300;
  color:rgba(255,255,255,.6);
  margin-bottom:2rem;
}
a.back-link{
  display:inline-block;
  padding:.6rem 1.6rem;
  border:1px solid rgba(79,195,247,.4);
  border-radius:2rem;
  color:#4fc3f7;
  text-decoration:none;
  font-size:.85rem;
  font-weight:500;
  letter-spacing:.06em;
  transition:all .3s ease;
}
a.back-link:hover{
  background:rgba(79,195,247,.1);
  border-color:rgba(79,195,247,.7);
  box-shadow:0 0 20px rgba(79,195,247,.15);
}
.tagline{
  position:fixed;
  bottom:1.5rem;left:0;right:0;
  text-align:center;
  font-size:.7rem;
  color:rgba(255,255,255,.3);
  letter-spacing:.08em;
  z-index:1;
}
</style>
</head>
<body>
<canvas id="starfield" aria-hidden="true"></canvas>

<div class="content">
  <div class="planet-icon" aria-hidden="true"></div>
  <h1>This planet is forming.</h1>
  <p class="message">Check back soon.</p>
  <a class="back-link" href="index.html">← Return to the Galaxy</a>
</div>

<p class="tagline">NextXus Federation · Truth Before Comfort</p>

<script>
(function(){
  var c=document.getElementById('starfield');
  var ctx=c.getContext('2d');
  var stars=[];
  var N=200;
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
  window.addEventListener('resize',resize);
  resize();
  for(var i=0;i<N;i++){
    stars.push({
      x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*1.2+.3,
      dx:(Math.random()-.5)*.1,dy:(Math.random()-.5)*.06,
      a:Math.random()*.4+.2,
      ts:Math.random()*.002+.001,tp:Math.random()*Math.PI*2
    });
  }
  function draw(t){
    ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      s.x+=s.dx;s.y+=s.dy;
      if(s.x<0)s.x=c.width;if(s.x>c.width)s.x=0;
      if(s.y<0)s.y=c.height;if(s.y>c.height)s.y=0;
      var tw=Math.sin(t*s.ts+s.tp)*.3+.7;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+(s.a*tw)+')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
